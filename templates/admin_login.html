<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRY-FIT | Admin Secure Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; background: var(--white);">

    <div style="padding: 20px 30px 0 30px;">
        <button type="button" class="nav-back-btn" onclick="if(window.history.length > 1){ window.history.back(); } else { window.location.href='/'; }" title="Go Back" aria-label="Back" style="all: unset; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px 0 8px; color: #111111; text-decoration: none; font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; background: #FFFFFF; border: 1px solid #E5E2DC; border-radius: 9999px; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; cursor: pointer; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05); transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1); flex-shrink: 0; user-select: none; box-sizing: border-box; vertical-align: middle; -webkit-appearance: none; appearance: none;">
            <span class="nav-back-icon" style="display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: #111111; color: #FFFFFF; flex-shrink: 0; transition: all 0.22s ease;">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width: 12px; height: 12px; stroke: currentColor; stroke-width: 2.6; fill: none; transition: transform 0.22s ease;">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </span>
            <span class="nav-back-text" style="line-height: 1; display: inline-block;">Back</span>
        </button>
    </div>
    <main class="container" style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px 20px 40px;">
        <div class="auth-container" style="margin: 0; width: 100%; max-width: 460px; padding: 60px 50px;">
            
            <div style="text-align: center; margin-bottom: 40px;">
                <a href="/" class="logo" style="font-size: 2rem; display: block; margin-bottom: 24px;">TRY-FIT</a>
                <h2 style="font-size: 1.4rem; margin-bottom: 8px; letter-spacing: 1px;">Admin Portal</h2>
                <p style="color: var(--muted); font-size: 0.85rem;">Authorized personnel only</p>
            </div>

            {{MESSAGE_ALERT}}

            <form method="POST" action="/api/admin/login" autocomplete="off">
                <div class="form-group">
                    <label class="form-label" for="email">Admin Email</label>
                    <input type="email" id="email" name="email" class="form-control" required placeholder="admin@tryfit.com" value="admin@tryfit.com">
                </div>
                
                <div class="form-group" style="margin-bottom: 30px;">
                    <label class="form-label" for="password">Security Key</label>
                    <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••">
                </div>
                
                <button type="submit" class="btn-primary" style="width: 100%; height: 50px;">Secure Login</button>
            </form>

            <div style="text-align: center; margin-top: 30px; padding-top: 30px; border-top: 1px solid var(--border);">
                <a href="/" style="font-size: 0.85rem; color: var(--muted); text-decoration: underline;">&larr; Return to Main Site</a>
            </div>
        </div>
    </main>

</body>
</html>
