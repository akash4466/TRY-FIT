<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRY-FIT | {{CLOTH_NAME}}</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        @keyframes pageLoadFade {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        body {
            animation: pageLoadFade 1.5s ease-in-out forwards;
        }
        .size-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            border: 1px solid var(--border);
            background: var(--white);
            color: var(--text);
            font-family: var(--font-sans);
            font-size: 0.95rem;
            cursor: pointer;
            text-decoration: none;
            transition: var(--transition-fast);
        }
        .size-btn:hover {
            border-color: var(--primary);
        }
        .size-btn.active {
            border-color: var(--primary);
            background: var(--primary);
            color: var(--white);
        }
    </style>
</head>
<body>
    {{HEADER}}

    <main class="container section-padding">
        
        <div class="quickview-card" style="max-width: 1200px; margin: 0 auto; box-shadow: none; border: 1px solid var(--border);">
            <div class="qv-image-container">
                <img src="{{CLOTH_IMAGE}}" alt="{{CLOTH_NAME}}" loading="lazy" decoding="async">
            </div>
            <div class="qv-details">
                <span class="product-category">{{CLOTH_CATEGORY}}</span>
                <h2 style="font-size: 3rem; margin-bottom: 20px;">{{CLOTH_NAME}}</h2>
                <div style="margin-bottom: 30px; display: flex; flex-direction: column; gap: 8px;">
                    <span class="buy-price" style="font-size: 1.2rem;">Retail Price: ₹{{CLOTH_PRICE}}</span>
                    <span class="trial-price" style="font-size: 1.4rem;">Try at home from ₹{{TRIAL_PRICE}}</span>
                </div>
                
                <p class="qv-desc" style="font-size: 1.1rem; line-height: 1.8;">
                    {{CLOTH_DESCRIPTION}}
                </p>
                
                <form action="/cart/add" method="POST" id="productAddToCartForm">
                    <input type="hidden" name="cloth_id" value="{{CLOTH_ID}}">
                    
                    <div style="margin-bottom:20px;">
                        <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:10px; text-transform:uppercase;">Size</label>
                        <div style="display:flex; gap:10px;">
                            <a href="/product?id={{CLOTH_ID}}&size=S" class="size-btn {{SIZE_S_ACTIVE}}">S</a>
                            <a href="/product?id={{CLOTH_ID}}&size=M" class="size-btn {{SIZE_M_ACTIVE}}">M</a>
                            <a href="/product?id={{CLOTH_ID}}&size=L" class="size-btn {{SIZE_L_ACTIVE}}">L</a>
                            <a href="/product?id={{CLOTH_ID}}&size=XL" class="size-btn {{SIZE_XL_ACTIVE}}">XL</a>
                        </div>
                        <input type="hidden" name="size" value="{{SELECTED_SIZE}}">
                    </div>
                    
                    <div style="margin-bottom:20px;">
                        <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:10px; text-transform:uppercase;">Color</label>
                        <select name="color" style="width:100%; padding:15px; border:1px solid var(--border); background:var(--background); font-family:var(--font-sans);">
                            <option value="Black">Black</option>
                            <option value="White">White</option>
                            <option value="Navy">Navy</option>
                        </select>
                    </div>

                    <div style="margin-bottom:30px;">
                        <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:10px; text-transform:uppercase;">Quantity</label>
                        <select name="quantity" style="width:100%; padding:15px; border:1px solid var(--border); background:var(--background); font-family:var(--font-sans);">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                        </select>
                    </div>
                    
                    <div style="display: flex; gap: 20px; flex-direction:column;">
                        <button type="submit" id="productAddToCartBtn" class="btn-primary" style="padding: 18px; font-size: 1rem; width:100%;">Add to Cart</button>
                    </div>
                </form>
                
                <div style="display:flex; gap:20px; margin-top:15px;">
                    <form action="/wishlist/add" method="POST" id="productAddToWishlistForm" style="flex:1;">
                        <input type="hidden" name="cloth_id" value="{{CLOTH_ID}}">
                        <button type="submit" id="productAddToWishlistBtn" class="btn-secondary" style="width:100%; padding:18px;">Add to Wishlist</button>
                    </form>
                    
                    <form action="/book-trial" method="GET" style="flex:1;">
                        <input type="hidden" name="id" value="{{CLOTH_ID}}">
                        <input type="hidden" name="size" value="{{SELECTED_SIZE}}">
                        <button type="submit" class="btn-secondary" style="width:100%; padding:18px;">Book Home Trial</button>
                    </form>
                </div>
            </div>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const cartForm = document.getElementById('productAddToCartForm');
            if (cartForm) {
                cartForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    const btn = document.getElementById('productAddToCartBtn');
                    const origText = btn ? btn.textContent : 'Add to Cart';
                    if (btn) {
                        btn.disabled = true;
                        btn.textContent = 'Adding...';
                    }
                    const formData = new FormData(cartForm);
                    const payload = {
                        cloth_id: formData.get('cloth_id'),
                        size: formData.get('size') || 'M',
                        color: formData.get('color') || 'Black',
                        quantity: parseInt(formData.get('quantity') || '1')
                    };
                    try {
                        const res = await fetch('/api/cart/add', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        const data = await res.json();
                        if (res.ok && data.success !== false) {
                            const countEl = document.querySelector('.cart-count');
                            if (countEl) {
                                if (data.cart_count !== undefined) countEl.textContent = data.cart_count;
                                else countEl.textContent = parseInt(countEl.textContent || '0') + payload.quantity;
                            }
                            if (typeof showToast === 'function') showToast('✓ Added to Cart!');
                            if (btn) {
                                btn.textContent = 'Added to Cart ✓';
                                btn.style.backgroundColor = '#15803d';
                                btn.style.borderColor = '#15803d';
                                setTimeout(() => {
                                    btn.disabled = false;
                                    btn.textContent = origText;
                                    btn.style.backgroundColor = '';
                                    btn.style.borderColor = '';
                                }, 1800);
                            }
                        } else {
                            if (typeof showToast === 'function') showToast(data.error || 'Could not add to cart');
                            if (btn) {
                                btn.disabled = false;
                                btn.textContent = origText;
                            }
                        }
                    } catch (err) {
                        if (typeof showToast === 'function') showToast('✓ Added to Cart!');
                        if (btn) {
                            btn.disabled = false;
                            btn.textContent = origText;
                        }
                    }
                });
            }

            const wishForm = document.getElementById('productAddToWishlistForm');
            if (wishForm) {
                wishForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    const btn = document.getElementById('productAddToWishlistBtn');
                    const origText = btn ? btn.textContent : 'Add to Wishlist';
                    const formData = new FormData(wishForm);
                    try {
                        const res = await fetch('/wishlist/add', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ cloth_id: formData.get('cloth_id') })
                        });
                        if (res.status === 401) {
                            window.location.href = '/account';
                            return;
                        }
                        if (typeof showToast === 'function') showToast('♥ Saved to Wishlist!');
                        if (btn) {
                            btn.textContent = 'Saved to Wishlist ♥';
                            btn.style.backgroundColor = '#111111';
                            btn.style.color = '#ffffff';
                            setTimeout(() => {
                                btn.textContent = origText;
                                btn.style.backgroundColor = '';
                                btn.style.color = '';
                            }, 1800);
                        }
                    } catch (err) {
                        if (typeof showToast === 'function') showToast('♥ Saved to Wishlist!');
                    }
                });
            }
        });
    </script>

    {{FOOTER}}
</body>
</html>
