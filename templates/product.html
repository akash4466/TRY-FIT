<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRY-FIT | {{CLOTH_NAME}}</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        @keyframes pageLoadFade {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        body {
            animation: pageLoadFade 1.5s ease-in-out forwards;
        }
        .size-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            border: 1px solid var(--border);
            background: var(--white);
            color: var(--text);
            font-family: var(--font-sans);
            font-size: 0.95rem;
            cursor: pointer;
            text-decoration: none;
            transition: var(--transition-fast);
        }
        .size-btn:hover {
            border-color: var(--primary);
        }
        .size-btn.active {
            border-color: var(--primary);
            background: var(--primary);
            color: var(--white);
        }
    </style>
</head>
<body>
    {{HEADER}}

    <main class="container section-padding">
        
        <div class="quickview-card" style="max-width: 1200px; margin: 0 auto; box-shadow: none; border: 1px solid var(--border);">
            <div class="qv-image-container">
                <img src="{{CLOTH_IMAGE}}" alt="{{CLOTH_NAME}}">
            </div>
            <div class="qv-details">
                <span class="product-category">{{CLOTH_CATEGORY}}</span>
                <h2 style="font-size: 3rem; margin-bottom: 20px;">{{CLOTH_NAME}}</h2>
                <div style="margin-bottom: 30px; display: flex; flex-direction: column; gap: 8px;">
                    <span class="buy-price" style="font-size: 1.2rem;">Retail Price: ${{CLOTH_PRICE}}</span>
                    <span class="trial-price" style="font-size: 1.4rem;">Try at home from ${{TRIAL_PRICE}}</span>
                </div>
                
                <p class="qv-desc" style="font-size: 1.1rem; line-height: 1.8;">
                    {{CLOTH_DESCRIPTION}}
                </p>
                
                <form action="/cart/add" method="POST">
                    <input type="hidden" name="cloth_id" value="{{CLOTH_ID}}">
                    
                    <div style="margin-bottom:20px;">
                        <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:10px; text-transform:uppercase;">Size</label>
                        <div style="display:flex; gap:10px;">
                            <a href="/product?id={{CLOTH_ID}}&size=S" class="size-btn {{SIZE_S_ACTIVE}}">S</a>
                            <a href="/product?id={{CLOTH_ID}}&size=M" class="size-btn {{SIZE_M_ACTIVE}}">M</a>
                            <a href="/product?id={{CLOTH_ID}}&size=L" class="size-btn {{SIZE_L_ACTIVE}}">L</a>
                            <a href="/product?id={{CLOTH_ID}}&size=XL" class="size-btn {{SIZE_XL_ACTIVE}}">XL</a>
                        </div>
                        <input type="hidden" name="size" value="{{SELECTED_SIZE}}">
                    </div>
                    
                    <div style="margin-bottom:20px;">
                        <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:10px; text-transform:uppercase;">Color</label>
                        <select name="color" style="width:100%; padding:15px; border:1px solid var(--border); background:var(--background); font-family:var(--font-sans);">
                            <option value="Black">Black</option>
                            <option value="White">White</option>
                            <option value="Navy">Navy</option>
                        </select>
                    </div>

                    <div style="margin-bottom:30px;">
                        <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:10px; text-transform:uppercase;">Quantity</label>
                        <select name="quantity" style="width:100%; padding:15px; border:1px solid var(--border); background:var(--background); font-family:var(--font-sans);">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                        </select>
                    </div>
                    
                    <div style="display: flex; gap: 20px; flex-direction:column;">
                        <button type="submit" class="btn-primary" style="padding: 18px; font-size: 1rem; width:100%;">Add to Cart</button>
                    </div>
                </form>
                
                <div style="display:flex; gap:20px; margin-top:15px;">
                    <form action="/wishlist/add" method="POST" style="flex:1;">
                        <input type="hidden" name="cloth_id" value="{{CLOTH_ID}}">
                        <button type="submit" class="btn-secondary" style="width:100%; padding:18px;">Add to Wishlist</button>
                    </form>
                    
                    <form action="/book-trial" method="GET" style="flex:1;">
                        <input type="hidden" name="id" value="{{CLOTH_ID}}">
                        <input type="hidden" name="size" value="{{SELECTED_SIZE}}">
                        <button type="submit" class="btn-secondary" style="width:100%; padding:18px;">Book Home Trial</button>
                    </form>
                </div>
            </div>
        </div>

    </main>

    {{FOOTER}}
</body>
</html>
