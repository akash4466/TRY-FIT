<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRY-FIT | Vendor Login</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .vendor-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #F5F3EF;
            border: 1px solid #E5E2DC;
            border-radius: 9999px;
            padding: 6px 16px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #111111;
            margin-bottom: 20px;
        }
    </style>
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; background: var(--background);">

    <header class="main-header" style="position: static; border-bottom: none;">
        <div class="container nav-wrapper">
            <div class="nav-left">
                <button type="button" onclick="window.location.href='/account'" style="all: unset; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px 0 8px; color: #111111; font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; background: #FFFFFF; border: 1px solid #E5E2DC; border-radius: 9999px; cursor: pointer;">
                    <span style="display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: #111111; color: #FFFFFF;">
                        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    </span>
                    <span>Back</span>
                </button>
            </div>
            <div class="nav-center"><a href="/" class="logo" style="font-size: 2rem;">TRY-FIT</a></div>
            <div class="nav-right"></div>
        </div>
    </header>

    <main class="container" style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
        <div class="auth-container" style="margin: 0; width: 100%; max-width: 480px; padding: 56px 50px; border-top: 4px solid #111111;">

            {{ERROR_ALERT}}
            {{INFO_ALERT}}

            <div style="text-align: center; margin-bottom: 32px;">
                <div class="vendor-badge"><span>🏪</span><span>Vendor Portal</span></div>
                <h2 style="font-size: 1.9rem; margin-bottom: 10px; font-family: var(--font-serif);">Vendor Sign In</h2>
                <p style="color: var(--muted); font-size: 0.92rem; line-height: 1.6;">Enter your business email to receive a login code</p>
            </div>

            <form method="POST" action="/api/vendor/login/send-otp" autocomplete="off" id="loginForm">
                <div class="form-group" style="margin-bottom: 24px;">
                    <label class="form-label">Business Email Address <span style="color:#e11d48;">*</span></label>
                    <input type="email" name="email" class="form-control" required placeholder="business@example.com" autocomplete="email" autofocus>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; height: 52px; font-size: 1rem; letter-spacing: 1.5px;" id="sendOtpBtn">
                    Send Login Code
                </button>
            </form>

            <div style="text-align: center; margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--border);">
                <p style="font-size: 0.85rem; color: var(--muted); margin-bottom: 12px;">New to TRY-FIT as a Vendor?</p>
                <a href="/vendor/register" class="btn-secondary" style="display: inline-block; padding: 12px 32px; text-decoration: none; font-size: 0.9rem;">Register as Vendor</a>

                <p style="font-size: 0.85rem; color: var(--muted); margin-top: 16px;">
                    Shopping instead? <a href="/account" style="color: #111111; font-weight: 600; text-decoration: underline;">User Login</a>
                </p>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function() {
            var btn = document.getElementById('sendOtpBtn');
            btn.disabled = true;
            btn.textContent = 'Sending Code...';
        });
    </script>
</body>
</html>
