<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRY-FIT | Verify Vendor Email</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .otp-inputs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 28px;
        }
        .otp-box {
            width: 52px;
            height: 60px;
            border: 2px solid #E5E2DC;
            border-radius: 10px;
            background: #fff;
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            color: #111111;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: monospace;
        }
        .otp-box:focus {
            border-color: #111111;
            box-shadow: 0 0 0 3px rgba(17,17,17,0.1);
        }
        .otp-box.filled {
            border-color: #111111;
            background: #F5F3EF;
        }
        .resend-timer {
            font-size: 0.85rem;
            color: var(--muted);
        }
        .resend-timer span {
            color: #111111;
            font-weight: 600;
        }
        .vendor-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #F5F3EF;
            border: 1px solid #E5E2DC;
            border-radius: 9999px;
            padding: 6px 16px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #111111;
            margin-bottom: 20px;
        }
        .step-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
        }
        .step-dot { width: 10px; height: 10px; border-radius: 50%; background: #E5E2DC; transition: background 0.3s; }
        .step-dot.done { background: #4ade80; }
        .step-dot.active { background: #111111; transform: scale(1.3); }
    </style>
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; background: var(--background);">

    <header class="main-header" style="position: static; border-bottom: none;">
        <div class="container nav-wrapper">
            <div class="nav-left">
                <button type="button" class="nav-back-btn" onclick="window.location.href='/vendor/register'" title="Go Back" style="all: unset; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px 0 8px; color: #111111; font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; background: #FFFFFF; border: 1px solid #E5E2DC; border-radius: 9999px; cursor: pointer;">
                    <span style="display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: #111111; color: #FFFFFF;">
                        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    </span>
                    <span>Back</span>
                </button>
            </div>
            <div class="nav-center"><a href="/" class="logo" style="font-size: 2rem;">TRY-FIT</a></div>
            <div class="nav-right"></div>
        </div>
    </header>

    <main class="container" style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
        <div class="auth-container" style="margin: 0; width: 100%; max-width: 500px; padding: 50px 46px; border-top: 4px solid #111111;">

            {{INFO_ALERT}}
            {{ERROR_ALERT}}

            <div style="text-align: center; margin-bottom: 30px;">
                <div class="vendor-badge"><span>📧</span><span>Email Verification</span></div>
                <h2 style="font-size: 1.9rem; margin-bottom: 10px; font-family: var(--font-serif);">Verify Your Email</h2>
                <p style="color: var(--muted); font-size: 0.92rem; line-height: 1.6;">
                    Enter the 6-digit code sent to<br>
                    <strong style="color: #111111;">{{EMAIL}}</strong>
                </p>
            </div>

            <div class="step-indicator">
                <div class="step-dot done"></div>
                <div style="height: 1px; width: 30px; background: #E5E2DC;"></div>
                <div class="step-dot active"></div>
                <div style="height: 1px; width: 30px; background: #E5E2DC;"></div>
                <div class="step-dot"></div>
            </div>
            <p style="text-align:center; color: var(--muted); font-size: 0.78rem; margin-bottom: 28px; letter-spacing: 1px; text-transform: uppercase;">Step 2 of 3 — Email Verification</p>

            <form method="POST" action="/api/vendor/verify-otp" autocomplete="off" id="otpForm">
                <input type="hidden" name="email" value="{{EMAIL}}">
                <input type="hidden" name="owner_name" value="{{OWNER_NAME}}">
                <input type="hidden" name="mobile" value="{{MOBILE}}">
                <input type="hidden" name="purpose" value="vendor_register">
                <input type="hidden" name="otp" id="otpHidden">

                <div class="otp-inputs" id="otpContainer">
                    <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" autofocus>
                    <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                    <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                    <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                    <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                    <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; height: 52px; font-size: 1rem; letter-spacing: 1.5px;" id="verifyBtn">
                    Verify OTP
                </button>
            </form>

            <div style="text-align: center; margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--border);">
                <p class="resend-timer" id="resendTimer">Resend code in <span id="countdown">30</span>s</p>

                <form method="POST" action="/api/vendor/send-otp" id="resendForm" style="display: inline; margin-top: 8px;">
                    <input type="hidden" name="email" value="{{EMAIL}}">
                    <input type="hidden" name="owner_name" value="{{OWNER_NAME}}">
                    <input type="hidden" name="mobile" value="{{MOBILE}}">
                    <input type="hidden" name="purpose" value="vendor_register">
                    <button type="submit" class="btn-text" id="resendBtn" disabled style="font-weight: 600; text-decoration: underline; opacity: 0.4;">
                        Resend Code
                    </button>
                </form>

                <div style="margin-top: 16px;">
                    <a href="/vendor/register" style="font-size: 0.85rem; color: var(--muted); text-decoration: underline;">Change Email Address</a>
                </div>
            </div>
        </div>
    </main>

    <script>
    (function() {
        // OTP box auto-advance
        var boxes = document.querySelectorAll('.otp-box');
        var hidden = document.getElementById('otpHidden');
        var form = document.getElementById('otpForm');
        var verifyBtn = document.getElementById('verifyBtn');

        boxes.forEach(function(box, i) {
            box.addEventListener('input', function() {
                var val = this.value.replace(/\D/g, '');
                this.value = val;
                if (val && i < boxes.length - 1) boxes[i + 1].focus();
                if (val) this.classList.add('filled');
                else this.classList.remove('filled');
                updateHidden();
            });
            box.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && !this.value && i > 0) {
                    boxes[i - 1].focus();
                    boxes[i - 1].value = '';
                    boxes[i - 1].classList.remove('filled');
                    updateHidden();
                }
            });
            box.addEventListener('paste', function(e) {
                e.preventDefault();
                var paste = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 6);
                paste.split('').forEach(function(ch, idx) {
                    if (boxes[idx]) { boxes[idx].value = ch; boxes[idx].classList.add('filled'); }
                });
                updateHidden();
                if (paste.length === 6) boxes[5].focus();
            });
        });

        function updateHidden() {
            hidden.value = Array.from(boxes).map(function(b) { return b.value; }).join('');
        }

        form.addEventListener('submit', function(e) {
            updateHidden();
            if (hidden.value.length !== 6) {
                e.preventDefault();
                alert('Please enter all 6 digits of the OTP.');
                return;
            }
            verifyBtn.disabled = true;
            verifyBtn.textContent = 'Verifying...';
        });

        // Resend countdown
        var seconds = 30;
        var cd = document.getElementById('countdown');
        var resendBtn = document.getElementById('resendBtn');
        var resendTimer = document.getElementById('resendTimer');

        var timer = setInterval(function() {
            seconds--;
            cd.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(timer);
                resendTimer.style.display = 'none';
                resendBtn.disabled = false;
                resendBtn.style.opacity = '1';
            }
        }, 1000);
    })();
    </script>
</body>
</html>
