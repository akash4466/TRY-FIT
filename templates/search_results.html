<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRY-FIT | Search Results</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    {{HEADER}}

    <main class="container section-padding">
        <div style="text-align: center; margin-bottom: 60px;">
            <p style="color: var(--muted); text-transform: uppercase; letter-spacing: 2px; font-size: 0.85rem; font-weight: 600;">Search Results</p>
            <h1 style="font-size: 2.5rem; margin-top: 10px;">"{{SEARCH_QUERY}}"</h1>
        </div>

        <!-- 3D Shuffle Catalog Sort Bar -->
        <div class="catalog-sort-bar">
            <div class="catalog-sort-info">
                <span class="catalog-sort-title">Matched Pieces</span>
                <span class="sort-3d-badge">3D Interactive</span>
            </div>
            <div class="catalog-sort-controls">

                <select class="luxury-sort-dropdown" aria-label="Sort products">
                    <option value="featured">Sort: Featured</option>
                    <option value="low-to-high">Price: Low to High</option>
                    <option value="high-to-low">Price: High to Low</option>
                </select>
            </div>
        </div>

        <div class="products-grid" id="catalog-container" style="margin-top: 10px;">
            {{CATALOG_GRID}}
        </div>
        
        <div style="text-align: center; margin-top: 60px;">
            <a href="/" class="btn-secondary">View All Collection</a>
        </div>
    </main>

    {{FOOTER}}

</body>
</html>
