<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{CATEGORY_TITLE}} | TRY-FIT</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    {{HEADER}}
    
    <main class="container section-padding">
        <h1 style="font-family: var(--font-serif); font-size: 2.5rem; margin-bottom: 30px;">{{CATEGORY_TITLE}}</h1>
        
        <div class="category-layout">
            <!-- Sidebar -->
            <aside class="filters-sidebar">
                <div class="filter-group">
                    <h4>Category</h4>
                    <div class="filter-option"><input type="checkbox"> <span>Shirts</span></div>
                    <div class="filter-option"><input type="checkbox"> <span>Jeans</span></div>
                    <div class="filter-option"><input type="checkbox"> <span>Dresses</span></div>
                </div>
                <div class="filter-group">
                    <h4>Brand</h4>
                    <div class="filter-option"><input type="checkbox"> <span>TRY-FIT Exclusive</span></div>
                    <div class="filter-option"><input type="checkbox"> <span>Luxury Label</span></div>
                </div>
                <div class="filter-group">
                    <h4>Size</h4>
                    <div class="filter-option"><input type="checkbox"> <span>S</span></div>
                    <div class="filter-option"><input type="checkbox"> <span>M</span></div>
                    <div class="filter-option"><input type="checkbox"> <span>L</span></div>
                    <div class="filter-option"><input type="checkbox"> <span>XL</span></div>
                </div>
            </aside>
            
            <!-- Grid -->
            <div>
                <div class="catalog-sort-bar" style="margin-top: 0; margin-bottom: 24px;">
                    <div class="catalog-sort-info">
                        <span style="font-size: 0.9rem; color: var(--muted); font-weight: 500;">Showing curated items</span>
                        <span class="sort-3d-badge">3D Shuffle Active</span>
                    </div>
                    <div class="catalog-sort-controls">
                        <div class="sort-pills-container">
                            <button type="button" class="sort-3d-btn active" data-sort="featured">Featured</button>
                            <button type="button" class="sort-3d-btn" data-sort="low-to-high">
                                <span>Price: Low to High</span>
                                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
                            </button>
                            <button type="button" class="sort-3d-btn" data-sort="high-to-low">
                                <span>Price: High to Low</span>
                                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                            </button>
                        </div>
                        <select class="luxury-sort-dropdown" aria-label="Sort products">
                            <option value="featured">Sort: Featured</option>
                            <option value="low-to-high">Price: Low to High</option>
                            <option value="high-to-low">Price: High to Low</option>
                        </select>
                    </div>
                </div>
                
                <div class="products-grid" style="margin-top: 0;">
                    {{CATALOG_GRID}}
                </div>
            </div>
        </div>
    </main>

    {{FOOTER}}
</body>
</html>
