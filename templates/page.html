<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} | TRY-FIT</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">
    {{HEADER}}

    <main class="container" style="flex: 1; padding: 60px 20px; max-width: 800px; margin: 0 auto;">
        <h1 style="font-size: 2.5rem; margin-bottom: 30px;">{{TITLE}}</h1>
        <div style="font-family: var(--font-serif); font-size: 1.1rem; line-height: 1.8; color: var(--text);">
            {{CONTENT}}
        </div>
        <div style="margin-top: 40px;">
            <a href="/" class="btn-primary">Return to Shop</a>
        </div>
    </main>

    {{FOOTER}}
</body>
</html>
